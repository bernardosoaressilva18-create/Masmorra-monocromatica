plugins {
    id "com.android.application"
}

android {
    namespace "com.ultimolegado.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.ultimolegado.game"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}
