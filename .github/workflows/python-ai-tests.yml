name: Tactical AI regression tests

on:
  push:
    branches: [feature/loot-system, main]
    paths:
      - "python-ai/**"
      - ".github/workflows/python-ai-tests.yml"
  pull_request:
    paths:
      - "python-ai/**"
      - ".github/workflows/python-ai-tests.yml"
  workflow_dispatch:

jobs:
  python-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r python-ai/requirements.txt
      - name: Run regression suite
        run: python -m unittest discover -s python-ai -v
