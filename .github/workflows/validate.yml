name: Validate O Ultimo Legado
on:
  push:
    branches:
      - feature/loot-system
  pull_request:
    branches:
      - feature/loot-system
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server JavaScript
        run: node --check server.js
      - name: Check client JavaScript
        run: node --check public/game.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'))"
      - name: Check skill count and branch limits are present
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const client = fs.readFileSync('public/game.js', 'utf8');
          const server = fs.readFileSync('server.js', 'utf8');
          const sharedStart = client.indexOf('const SKILL_BRANCHES = [');
          const sharedEnd = client.indexOf('function getCurrentSkillBranches()', sharedStart);
          const sharedBlock = client.slice(sharedStart, sharedEnd);
          const sharedIds = [...sharedBlock.matchAll(/\\{id:'([^']+)'/g)].map(m => m[1]);
          if (sharedIds.length !== 20 || new Set(sharedIds).size !== 20) throw new Error('Shared skill tree must contain 20 unique talents');

          const personalStart = client.indexOf('const CLASS_PERSONAL_SKILLS_UI = ') + 'const CLASS_PERSONAL_SKILLS_UI = '.length;
          const personalEnd = client.indexOf(';', personalStart);
          const personal = JSON.parse(client.slice(personalStart, personalEnd));
          for (const [className, skills] of Object.entries(personal)) {
            if (!Array.isArray(skills) || skills.length !== 5) throw new Error('Class must have 5 exclusive talents: ' + className);
            if (new Set(skills.map(skill => skill.id)).size !== 5) throw new Error('Duplicate class talent: ' + className);
          }
          console.log('OK: 20 shared talents and 5 unique talents per class.');
          if (!server.includes('player.skills.length >= 15') || !server.includes('usedBranches.size < 3')) throw new Error('Server must enforce 15 talents and max 3 branches');
          for (const id of ['knight','mage','archer','goblin','ogre']) if (!server.includes(id + ': { hp:')) throw new Error('Missing class stats: ' + id);
          console.log('OK: 25 unique talents, 5 classes, limits verified.');
          NODE
