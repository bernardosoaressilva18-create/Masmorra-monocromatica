name: Build O Último Legado Android APK

on:
  push:
    branches:
      - feature/loot-system
    paths:
      - 'android-app/**'
      - 'public/index.html'
      - 'public/style.css'
      - 'public/game.js'
      - 'server.js'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: feature/loot-system

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-app --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-Ultimo-Legado-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        if: github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: O Último Legado Android - build ${{ github.run_number }}
          body: |
            APK instalável do O Último Legado.
            A tela é fixada em orientação vertical (retrato).
            O jogo multiplayer carrega a versão hospedada no Render e requer internet.
          prerelease: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
